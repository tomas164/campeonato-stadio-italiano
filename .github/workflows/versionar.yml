name: Versionar CSS y JS

# Cada vez que cambian los estilos o el código, actualiza la versión en
# index.html para que los visitantes no vean archivos viejos del caché.
on:
  push:
    branches: [main]
    paths:
      - styles.css
      - app.js
      - index.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/versionar.py
      - name: Publicar si cambió
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Actualizar versión de CSS y JS"
          git push
