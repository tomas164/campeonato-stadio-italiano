name: Calendarios

on:
  push:
    branches: [main]
    paths:
      - data/torneo.json
      - tools/generar_calendarios.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Generar archivos .ics
        run: python tools/generar_calendarios.py
      - name: Publicar si cambiaron
        run: |
          if git diff --quiet -- cal; then
            echo "Sin cambios en los calendarios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add cal
          git commit -m "Actualizar calendarios"
          git push
