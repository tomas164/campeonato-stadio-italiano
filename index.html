<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campeonato Stadio Italiano 2026</title>
  <meta name="description" content="Fixture, posiciones, goleadores y sancionados del campeonato interno de Stadio Italiano.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="tricolore" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="wrap">
      <p class="kicker">Stadio Italiano · Campeonato interno</p>
      <h1>Campeonato 2026</h1>
      <p class="sub" id="actualizado"></p>
    </div>
  </header>

  <nav class="cats wrap" id="categorias" role="tablist" aria-label="Categorías"></nav>

  <main class="wrap">
    <section id="proximos" class="card">
      <h2>Próxima fecha</h2>
      <div id="proximos-body"></div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>Posiciones</h2>
        <div class="table-scroll"><table class="tabla" id="posiciones"></table></div>
        <p class="nota">3 puntos por victoria y 1 por empate. Desempate por diferencia de gol y goles a favor.</p>
      </section>

      <section class="card">
        <h2>Goleadores</h2>
        <div id="goleadores"></div>
      </section>
    </div>

    <section class="card">
      <h2>Fixture y resultados</h2>
      <div id="fixture"></div>
    </section>

    <section class="card">
      <h2>Sancionados</h2>
      <div id="sancionados"></div>
    </section>
  </main>

  <footer class="wrap pie">Stadio Italiano · Campeonato interno 2026</footer>

  <script src="app.js"></script>
</body>
</html>
